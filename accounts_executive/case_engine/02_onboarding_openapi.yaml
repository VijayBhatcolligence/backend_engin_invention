components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - gate
            - class
            - message
            properties:
              gate:
                type: string
              class:
                type: string
                enum:
                - Input
                - Consistency
                - Probe
                - Uniqueness
                - Business
                - State
                - Authority
              message:
                type: string
              field:
                type: string
              send_back:
                type: boolean
              use_id:
                type: string
    ActionResult:
      type: object
      required:
      - invocation_id
      - event_id
      properties:
        invocation_id:
          type: string
        event_id:
          type: string
        subject:
          type: object
  responses:
    ActionResult:
      description: Done
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionResult'
    Error:
      description: A gate stopped the call (422), a state or version conflict (409), authority (403), not found (404), outside service (502)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
